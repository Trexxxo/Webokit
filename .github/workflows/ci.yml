name: Webokit checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and Wobkot submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run firmware parser tests
        run: npm test
      - name: Check Python syntax
        run: python -m py_compile host.py tools/generate-cert.py
      - name: Check submodule checkout
        run: test -f engine/wobkot/index.html && test -f engine/wobkot/src/ps5/impl.js
